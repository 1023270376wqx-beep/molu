const works={vessel:{index:"01 · 形",title:"留白的形",body:"视线穿过孔洞，才重新看见周围的实体。粗粝的陶土包围着一块空白，器物的轮廓也由这块空白决定。",alt:"带椭圆孔洞的红陶器物完整图"},bowls:{index:"02 · 痕",title:"旋转的痕",body:"同心的纹路把动作留在表面。微小的颗粒、深浅不一的环纹，让相近的两只碗仍然各有性格。",alt:"两只带有环纹的米白色陶碗完整图"},glaze:{index:"03 · 釉",title:"釉色的呼吸",body:"近看时，釉面并不是均匀的一层颜色。细裂、颗粒与刻痕改变光的走向，灰青色也因此显出层次。",alt:"灰青釉面微观肌理完整图"}};
document.querySelectorAll("[data-art]").forEach(b=>b.addEventListener("click",()=>{const key=b.dataset.art,w=works[key];detailImage.src=({"vessel": "efc4d379008f4d702d.png", "bowls": "84bced7da29267f4e9.png", "glaze": "a7f5802df73310abd0.png"})[key];detailImage.alt=w.alt;document.querySelector("#detail-index").textContent=w.index;document.querySelector("#detail-title").textContent=w.title;document.querySelector("#detail-body").textContent=w.body;detail.showModal();}));
detail.querySelector(".detail-close").addEventListener("click",()=>detail.close());
detail.addEventListener("click",e=>{if(e.target===detail){const r=detail.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)detail.close();}});
document.querySelector("#replay").hidden=!window.gsap;
if(!window.gsap)return;
const mm=gsap.matchMedia();let heroIntro;
mm.add("(prefers-reduced-motion: no-preference)",()=>{
heroIntro=gsap.timeline({defaults:{ease:"power3.out",duration:.95}});
heroIntro.from(".hero-line",{y:35,autoAlpha:0,stagger:.11},0).from(".english span",{y:20,autoAlpha:0,stagger:.1},.2).from(".hero-bottom",{y:16,autoAlpha:0},.4).from(".hero-photo img",{scale:1.04,autoAlpha:0,duration:1.25},.05).from(".hero-visual figcaption",{autoAlpha:0},.65);
let galleryIntro;const observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)){galleryIntro=gsap.timeline({defaults:{ease:"power3.out",duration:.8}}).from(".observation-head",{y:20,autoAlpha:0},0).from(".study",{y:28,autoAlpha:0,stagger:.12},.12);observer.disconnect();}},{threshold:.12});observer.observe(document.querySelector(".gallery"));
const replay=()=>{document.querySelector("#concept").scrollIntoView({behavior:"auto"});heroIntro.restart();};
document.querySelector("#replay").addEventListener("click",replay);
return()=>{observer.disconnect();document.querySelector("#replay").removeEventListener("click",replay);if(galleryIntro)galleryIntro.kill();};
});
mm.add("(prefers-reduced-motion: reduce)",()=>{document.querySelector("#replay").hidden=true;return()=>{document.querySelector("#replay").hidden=false;};});
})();
</script></body></html>
